<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메가박스</title>
    <!-- <link rel="stylesheet" href="movie.css"> -->
    <link rel="stylesheet" href="movies(ai).css">
    <script src="movies.js" defer></script>
</head>
<body>
    <h2>빠른예매</h2>
    <div class="all">
        <div id="main">
            <hr>
            <div class="reset">
                <p>관람인원선택</p>
                <button onclick="reset()">🔄초기화</button>
            </div>
            <div class=reserve>
                <div class="reserve_main_1">
                    <p class="people">성인</p>
                    <div class="reserve_main"><button onclick="adult_m()">-</button>
                        <p id="a_count">0</p><button onclick="adult_p()">+</button>
                    </div>
                </div>
                <div class="reserve_main_1">
                    <p class="people">청소년</p>
                    <div class="reserve_main"><button onclick="teenager_m()">-</button>
                        <p id="t_count">0</p><button onclick="teenager_p()">+</button>
                    </div>
                </div>
                <div class="reserve_main_1">
                    <p class="people">경로</p>
                    <div class="reserve_main"><button onclick="Path_m()">-</button>
                        <p id="p_count">0</p><button onclick="Path_p()">+</button>
                    </div>
                </div>
                <div class="reserve_main_1">
                    <p class="people">우대</p>
                    <div class="reserve_main"><button onclick="Preferential_m()">-</button>
                        <p id="pre_count">0</p><button onclick="Preferential_p()">+</button>
                    </div>
                </div>
            </div>
            <div id="seat">
                <p>&nbsp;[알림] 커플석은 2,4,6,8명일 경우 선택하실 수 있습니다.</p>
                <h3>SCREEN</h3>
                <div id="seat_row"></div>
                <div id="seat_output"></div>
            </div>
        </div>
        <div class="movie_info">
            <div>
                <div class="title">
                    <p><span>15</span> 어쩔수가없다</p>
                </div>
                <div class="movie_type">
                    <span>2D</span>
                </div>
                <hr>
                <div class="movie_main">
                    <ul>
                        <li>
                            <p class="place">대전중앙로</p>
                            <p class="type">1관 [Laser]</p>
                            <p class="day">2025.10.03(금)</p>
                        </li>
                        <li>
                            <select>
                                <option value="09:40~12:08">09:40~12:08</option>
                                <option value="09:40~12:08">10:40~13:08</option>
                                <option value="09:40~12:08">11:40~14:08</option>
                            </select>
                        </li>
                    </ul>
                    <div>
                        <img src="/MegaBox/다운로드.webp" alt="">
                    </div>
                </div>
                <hr>
                <div>
                    <div class="seat_info">
                        <ul class="seat_coment">
                            <li><span class="adult">🟪</span> 선택</li>
                            <li><span class="예매완료">☒</span> 예매완료</li>
                            <li><span class="선택불가">⬜</span> 선택불가</li>
                            <li><span class="장애인석">🟩</span> 장애인석</li>
                            <li><span class="리클라이너석">🟨</span> 리클라이너석</li>
                        </ul>
                        <div>
                            <p class="choice">선택 좌석</p>
                            <div id="seat_output_1">
                                </>
                            </div>
                        </div>
                    </div>
                    <div class="total">
                        <p id="total_price">     
                            성인 0명<br>청소년 0명<br>경로 0명<br>우대 0명<br>
                        </p>
                    </div>
                </div>
                <div class="btn">
                    <button class="le" onclick="back()">이전</button>
                    <button class="ri" onclick="next()">확인</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
