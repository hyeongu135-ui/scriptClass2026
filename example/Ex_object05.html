<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장바구니</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');

    @property --angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
    }

    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
        background: #060612;
    }

    body {
        min-height: 100vh;
        margin: 0;
        padding: 100px 24px 80px;
        position: relative;
        isolation: isolate;
        color: #f5f3ff;
        font-family: "Noto Sans KR", sans-serif;
        background:
            radial-gradient(ellipse at 15% 0%, #5521a530, transparent 55%),
            radial-gradient(ellipse at 95% 80%, #007c9130, transparent 50%),
            #060612;
    }

    /* 움직이는 오로라 */
    body::before {
        content: "";
        position: fixed;
        z-index: -2;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(ellipse at 20% 30%, #9333ea65, transparent 42%),
            radial-gradient(ellipse at 80% 20%, #2563eb50, transparent 40%),
            radial-gradient(ellipse at 70% 80%, #06b6d450, transparent 42%),
            radial-gradient(ellipse at 10% 90%, #db277740, transparent 35%);
        background-size: 150% 150%;
        filter: blur(45px);
        animation: aurora 18s ease-in-out infinite alternate;
    }

    /* 별빛과 격자 */
    body::after {
        content: "";
        position: fixed;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background-image:
            radial-gradient(circle, #ffffff80 1px, transparent 1.8px),
            radial-gradient(circle, #a5b4fc70 1px, transparent 1.8px),
            linear-gradient(#ffffff05 1px, transparent 1px),
            linear-gradient(90deg, #ffffff05 1px, transparent 1px);
        background-size:
            137px 151px,
            211px 193px,
            60px 60px,
            60px 60px;
        background-position:
            12px 30px,
            80px 90px,
            center center,
            center center;
        mask-image: linear-gradient(#000, #0008 65%, transparent);
    }

    ::selection {
        background: #a855f7;
        color: white;
    }

    /* 타이틀 */
    h2 {
        position: relative;
        max-width: 1040px;
        margin: 0 auto 42px;
        padding-top: 46px;
        font-size: clamp(36px, 6vw, 64px);
        font-weight: 900;
        line-height: 1.3;
        letter-spacing: -3px;
        color: transparent;
        background: linear-gradient(
            100deg,
            #ffffff 10%,
            #ddd6fe 30%,
            #c084fc 50%,
            #67e8f9 70%,
            #ffffff 90%
        );
        background-size: 250% auto;
        background-clip: text;
        -webkit-background-clip: text;
        filter: drop-shadow(0 0 25px #a855f740);
        animation:
            titleFlow 8s linear infinite,
            enter 0.8s ease both;
    }

    h2::before {
        content: "✦  THE COLLECTION / 01";
        position: absolute;
        top: 0;
        left: 0;
        color: #a5b4fc;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 4px;
    }

    h2::after {
        content: "당신의 취향을 담은, 특별한 선택.";
        display: block;
        margin-top: 18px;
        color: #aaa9c4;
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0;
    }

    /* 회전하는 그라데이션 테두리 */
    table {
        --angle: 0deg;
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        border: 1px solid transparent;
        border-radius: 26px;
        border-spacing: 0;
        border-collapse: separate;
        overflow: hidden;
        background:
            linear-gradient(#111123, #0c1020) padding-box,
            conic-gradient(
                from var(--angle),
                #ffffff15,
                #a855f7,
                #ffffff15 30%,
                #ffffff15 50%,
                #22d3ee,
                #ffffff15 80%
            ) border-box;
        box-shadow:
            0 35px 90px #00000070,
            0 0 60px #7c3aed15,
            inset 0 1px 0 #ffffff0d;
        animation:
            borderSpin 10s linear infinite,
            enter 0.9s ease both;
    }

    thead {
        background: linear-gradient(110deg, #7c3aed25, #2563eb18, #06b6d425);
    }

    th {
        padding: 23px 18px;
        border-bottom: 1px solid #ffffff12;
        color: #a8abc8;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 2px;
        white-space: nowrap;
    }

    th:first-child {
        padding-left: 32px;
        text-align: left;
    }

    td {
        padding: 30px 18px;
        border-bottom: 1px solid #ffffff0b;
        text-align: center;
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        transition:
            background-color 0.3s,
            box-shadow 0.3s,
            color 0.3s;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    tbody tr:hover td {
        background-color: #a78bfa0c;
    }

    tbody tr:hover td:first-child {
        box-shadow: inset 3px 0 #a78bfa;
    }

    td:first-child {
        padding-left: 32px;
        text-align: left;
        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
    }

    /* 상품명 앞 아이콘 */
    td:first-child::before {
        content: "✦";
        display: inline-grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-right: 18px;
        vertical-align: middle;
        border: 1px solid #c084fc35;
        border-radius: 16px;
        background: linear-gradient(135deg, #a855f72b, #6366f110);
        box-shadow:
            inset 0 1px 0 #ffffff15,
            0 8px 18px #00000020;
        font-size: 25px;
        transition: transform 0.35s, box-shadow 0.35s;
    }

    /* 버튼의 기존 상품 인덱스로 아이콘 구분 */
    tr:has(button[onclick*="plus(0)"]) td:first-child::before {
        content: "💻";
    }

    tr:has(button[onclick*="plus(1)"]) td:first-child::before {
        content: "🖱️";
        border-color: #22d3ee35;
        background: linear-gradient(135deg, #06b6d42b, #3b82f610);
    }

    tr:has(button[onclick*="plus(2)"]) td:first-child::before {
        content: "⌨️";
        border-color: #f472b635;
        background: linear-gradient(135deg, #ec48992b, #a855f710);
    }

    tr:hover td:first-child::before {
        transform: translateY(-3px) rotate(-7deg) scale(1.08);
        box-shadow: 0 0 24px #a855f730;
    }

    td:nth-child(2) {
        color: #b8bad0;
        font-size: 14px;
    }

    td:nth-child(2)::after,
    td:nth-child(4)::after {
        content: "원";
        margin-left: 5px;
        font-size: 11px;
        font-weight: 400;
        opacity: 0.6;
    }

    td:nth-child(3) {
        color: #e9d5ff;
        font-size: 23px;
        font-weight: 800;
        text-shadow: 0 0 20px #c084fc50;
    }

    td:nth-child(4) {
        color: #67e8f9;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
        text-shadow: 0 0 24px #22d3ee30;
    }

    td:last-child {
        white-space: nowrap;
    }

    /* 버튼 */
    button {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: 39px;
        height: 39px;
        margin: 0 3px;
        padding: 0;
        border: 1px solid #ffffff20;
        border-radius: 12px;
        background: linear-gradient(145deg, #ffffff12, #ffffff05);
        box-shadow: inset 0 1px 0 #ffffff0d;
        color: #e9e5ff;
        font-family: inherit;
        font-size: 19px;
        cursor: pointer;
        transition:
            transform 0.2s,
            border-color 0.2s,
            background 0.2s,
            box-shadow 0.2s;
    }

    button::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(120deg, transparent 25%, #ffffff35, transparent 75%);
        transform: translateX(-130%);
        transition: transform 0.5s;
    }

    button:hover::before {
        transform: translateX(130%);
    }

    button:hover {
        transform: translateY(-4px);
        border-color: #a78bfa;
        background-color: #6d28d9;
        box-shadow:
            0 8px 20px #7c3aed45,
            0 0 15px #a855f730;
        color: white;
    }

    button:first-child {
        border-color: #a78bfa60;
        background-color: #7c3aed40;
    }

    button:last-child {
        margin-left: 10px;
        border-color: #fb718535;
        background-color: #f43f5e15;
        color: #fda4af;
    }

    button:last-child:hover {
        border-color: #fb7185;
        background-color: #e11d48;
        box-shadow: 0 8px 24px #e11d4850;
        color: white;
    }

    button:active {
        transform: translateY(0) scale(0.9);
    }

    button:focus-visible {
        outline: 2px solid #67e8f9;
        outline-offset: 4px;
    }

    /* 총 금액 */
    #total {
        --angle: 0deg;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        max-width: 1040px;
        margin: 28px auto 0;
        padding: 38px;
        border: 1px solid transparent;
        border-radius: 24px;
        background:
            linear-gradient(120deg, #271747, #172342 65%, #123342) padding-box,
            conic-gradient(
                from var(--angle),
                #a855f7,
                #4338ca,
                #22d3ee,
                #4338ca,
                #a855f7
            ) border-box;
        box-shadow:
            0 25px 60px #00000045,
            0 0 45px #8b5cf71a;
        color: #ffffff;
        text-align: right;
        font-size: clamp(24px, 4vw, 38px);
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        letter-spacing: -1px;
        text-shadow: 0 0 28px #c4b5fd40;
        animation:
            borderSpin 8s linear infinite reverse,
            enter 1.1s ease both;
    }

    #total::before {
        content: "✦  TOTAL AMOUNT";
        display: block;
        margin-bottom: 14px;
        color: #c4b5fd;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 4px;
        text-shadow: none;
    }

    #total::after {
        content: "";
        position: absolute;
        z-index: -1;
        top: -100%;
        left: -60%;
        width: 35%;
        height: 300%;
        background: linear-gradient(
            90deg,
            transparent,
            #c4b5fd18,
            #ffffff18,
            transparent
        );
        transform: rotate(25deg);
        pointer-events: none;
        animation: lightSweep 7s ease-in-out infinite;
    }

    @keyframes aurora {
        0% {
            background-position: 0% 0%;
            opacity: 0.65;
        }
        50% {
            background-position: 100% 40%;
            opacity: 1;
        }
        100% {
            background-position: 30% 100%;
            opacity: 0.75;
        }
    }

    @keyframes titleFlow {
        to {
            background-position: 250% center;
        }
    }

    @keyframes borderSpin {
        to {
            --angle: 360deg;
        }
    }

    @keyframes lightSweep {
        0%, 55% {
            left: -60%;
        }
        100% {
            left: 150%;
        }
    }

    @keyframes enter {
        from {
            opacity: 0;
            transform: translateY(24px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 760px) {
        body {
            padding: 50px 12px;
        }

        h2 {
            margin-bottom: 28px;
        }

        th {
            padding: 18px 5px;
            font-size: 11px;
            letter-spacing: 0;
        }

        td {
            padding: 22px 5px;
        }

        th:first-child,
        td:first-child {
            padding-left: 12px;
        }

        td:first-child {
            font-size: 13px;
        }

        td:first-child::before {
            display: grid;
            width: 40px;
            height: 40px;
            margin: 0 0 9px;
            border-radius: 12px;
            font-size: 21px;
        }

        td:nth-child(2) {
            font-size: 11px;
        }

        td:nth-child(3) {
            font-size: 18px;
        }

        td:nth-child(4) {
            font-size: 13px;
        }

        td:nth-child(2)::after,
        td:nth-child(4)::after {
            display: block;
            margin: 3px 0 0;
            font-size: 10px;
        }

        button {
            width: 27px;
            height: 32px;
            margin: 0;
            border-radius: 8px;
            font-size: 15px;
        }

        button:last-child {
            margin-left: 2px;
        }

        #total {
            padding: 28px 20px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation: none !important;
            transition: none !important;
        }
    }
</style>
</head>
<body>
    <h2>장바구니</h2>
        <table id="cartTable">
            <thead>
                <tr>
                    <th>상품명</th>
                    <th>가격</th>
                    <th>수량</th>
                    <th>합계</th>
                    <th>조작</th>
                </tr>
            </thead>
            <tbody id="cartBody"></tbody>
        </table>
        <div id="total">총 금액: 0원</div>
    <script>
        let cartTable = document.getElementById('cartTable');
        let total = document.getElementById('total');
        let cartBody = document.getElementById('cartBody');
        let cartList = [
                        { id: 1, name: '노트북', price: 1200000, quantity: 1 },
                        { id: 2, name: '마우스', price: 20000, quantity: 2 },
                        { id: 3, name: '키보드', price: 50000, quantity: 1 },
                        ];

                        function renderCart(){
                            let result = '';
                            let total1 = 0;
                            for(let i = 0; i < cartList.length; i++){
                                let sum = 0;
                                result +=`<tr>`
                                    sum += cartList[i].price * cartList[i].quantity            
                                    total1 += sum;
                                    result+= `<td>${cartList[i].name}</td>
                                            <td>${cartList[i].price.toLocaleString()}</td>
                                            <td>${cartList[i].quantity}</td>
                                             <td>${sum.toLocaleString()}</td>
                                        <td><button onclick = 'plus(${i})'>+</button>
                                        <button onclick = 'minus(${i})'>-</button>
                                        <button onclick = 'delet(${i})'>x</button></td>`
                                        // sum += cartList[i].price * cartList[i].quantity            
                                        
                                    }
                                    // console.log(total1);
                                    // console.log(result)
                                    result +=`</tr>`
                                    cartBody.innerHTML = result;
                                    total.innerHTML = `총 금액 ${total1.toLocaleString()}`
                                }
                                
                                renderCart();

                                    function plus(i){
                                        if(cartList[i].quantity > 9){
                                            alert('더 이상 증가 불가능');
                                            return;
                                        }else{
                                            cartList[i].quantity++;
                                        }
                                        renderCart();
                                    };

                                    function minus(i){
                                        if(cartList[i].quantity < 1){
                                            alert('더 이상 증가 불가능');
                                        }else{
                                            cartList[i].quantity--;
                                            
                                        }
                                        renderCart();
                                    };

                                    function delet(i){
                                        cartList.splice(i,1);
                                        renderCart()
                                    };
                                    </script>
</body>
</html>
