<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 연습문제 기초</title>
</head>
<body>
    <!-- problem1() 스크립트에서 작성할 함수 이름이다.
        버튼을 클릭하는 사건이 일어나면 problem1()함수를 호출하여
        실행하라 라는 의미이다.
        단, 함수는 스크립트영역에만 작성할 수 있다. 
    -->
    <button onclick="problem()">문제1: 변수와 상수 출력</button>
    <p id="p1"></p>
    <hr>
    <button onclick="problem2()">문제2 : 두 수 더하기</button>
    <p id="p2"></p>

    <input id="numInput" type="number" placeholder="숫자 입력" />
    <button onclick="showVariable()">값 확인</button>
    <p id="output1"></p>

    <script>
        let print01 = document.getElementById('p1');
            function problem(){
                let name = '홍길동';
                let age = 20;
            // DOM을 이용한다. 자바스크립트가 태그에 접근하도록
            // 작성하는 방법이다.
            // p1이라는 id 가진 태그에 안에 문자로 이름 : 홍길동, 나이:20으로 저장하여 주세요
            // document.getElementById('p1').innerText='이름 : ' +name+ ' 나이 : ' +age;
            print01.innerText=`이름 : ${name}  나이 : ${age}`;
            }
        let print02 = document.getElementById('p2')
                function problem2(){
                    let a = 10;
                    let b = 20;
                    let sum = a+b;
                    print02.innerText=`합계 : ${sum}`;
                }
                let print03 = document.getElementById('output1')
            function showVariable() {
                // input태그를 이용해 입력받은 모든 값은 문자임
                // 형변환을 하여 연산을함 => 스크립트 형변환 함수 Number()사용.
                let c = Number(document.getElementById('numInput').value);
                print03.innerText =`변수 Num : ${c+'a'}`;
                }
            
    </script>
</body>
</html>
