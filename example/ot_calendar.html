<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달력
    </title>
</head>
<body>
    <!-- 1. html -->
    <!-- 2. 배열의 달력값만 저장하는 함수 -->
    <!-- 3. 화면에 출력하는 함수 -->
    <!-- 달력 HTML 구조 -->
     <div id="container">
        <div id="data-wrap">
            <button id = "previousButton" onclick="previousButton()">&lt;</button>
            <div id="main_date"></div>
            <button id = "nextButton" onclick="nextButton()">&gt;</button>
        </div>
        <table id="data_week">
            <thead>
                <th>SUN</th>
                <th>MON</th>
                <th>TUE</th>
                <th>WED</th>
                <th>THU</th>
                <th>FRI</th>
                <th>SAT</th>
            </thead>
        </table>
        <!-- 달력 날짜 값 입력 -->
         <div id="displaytable"></div>
     </div>
     <script>
        let yearMonth = document.getElementById('main_date');
        let displayTable = document.getElementById('displaytable');
        let today = new Date();

        // 2차원 배열 지정
        let arr = Array.from(Array(6),()=>new Array(7));

        //  달력의 배열에 값을 지정하는 함수 작성
        function calendar(){
            let year = today.getFullYear(); // 현재년도
            let month = today.getMonth(); //월
            //시작일의 요일 몇번째인지 찾기
            // 이달의 마지막 일자 찾기 28,30,31
            let lastDate = new Date(year, month+1, 0);
            let lastDay = lastDate.getDate(); // 마지막 일자 = > 31
            let startDate = new Date(year,month,1);// 월의 첫 일자
            let startDay = startDate.getDate();// 월의 일자
            let startweek = startDate.getDay(); // 요일이 숫자(0-6),4(목)
            // 일 월 화 수 목 금 토 
            //             1  2  3 => 0
            //                   31
            let row = 0; // arr[row][startweek]

            //배열값을 빈값으로 초기화
            for(let i = 0 ; i < arr.length; i++){
                for(let j = 0 ; j < arr[i].length; j++){
                    arr[i][j] = '';
                }
            }

            //달력배열에 실제 값을 채우는 코드
            for(let i = startDay; i<=lastDay; i++){
                arr[row][startweek] = i; //
                // 7일이 되면 줄바꿈
                if(startweek < 6){
                    startweek++;
                }else{
                    row++;
                    startweek =0;
                    //startWeek = 0으로 초기화 => 일요일부터 다시 진행
                }
            }

            console.log(`${year}년 ${month+1}월 달력 데이터 : `,arr);
        }   
        calendar()
        function display(){
            calendar();

            let tb ="<table class ='cal_table'>" ;
            for(let i = 0 ; i < arr.length; i++){
                tb += "<tr>";
                    for(let j = 0 ;  j < arr[i].length; j++){
                        tb += "<td> " + arr[i][j]+"</td>"
                    }
                    tb += "</tr>";
            }
            tb += "</table>";
            let yearmonth = today.getFullYear() + '년' + (today.getMonth()+1)+'월';
            yearMonth.innerHTML = yearmonth;
            displayTable.innerHTML = tb;
        }

        display();

        function previousButton(){
            today = new Date(today.getFullYear(),today.getMonth()-1,1)
            display();
        }

        function nextButton(){
            today = new Date(today.getFullYear(),today.getMonth()+1,1)
            display();
        }
        // function calendar 값 콘솔
        
        //화면 출력

        
        // let year = 2025;
        // let month = 4;
        // let last = new Date(year,month+1,0);
        // let day02 = last.getDate();
        // console.log(day02);
        // console.log(last.toLocaleDateString());
     </script>
</body>
</html>
