<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        width: 400px;
        margin: 100px auto;
        padding: 30px;

        border: 1px solid #ccc;
        border-radius: 10px;

        text-align: center;
        font-family: Arial, sans-serif;

        box-shadow: 3px 3px 15px #ccc;
    }

    #num{
        width: 220px;
        height: 40px;

        padding-left: 10px;

        border: 1px solid #aaa;
        border-radius: 5px;

        font-size: 16px;
    }

    #num:focus{
        outline: none;
        border: 1px solid #14563a;
    }

    button{
        width: 80px;
        height: 40px;

        margin-left: 5px;

        border: none;
        border-radius: 5px;

        background-color: #14563a;
        color: white;

        cursor: pointer;
    }

    button:hover{
        background-color: white;
        color: #14563a;
        border: 1px solid #14563a;
    }

    #print_1{
        min-height: 45px;

        margin: 20px 0;
        padding: 12px;

        background-color: #f5f5f5;
        border-radius: 5px;

        font-size: 18px;
        font-weight: bold;
        color: #333;
    }
</style>
</head>
<body>
    <!-- 문제 : input 태그에서 입력한 숫자에 해당하는
                합계를 구하여 p태그에 출력하시오.
                단, 무조건 1부터 합계를 구하시오
                for 반복문 사용
                확인 버튼을 클릭하면 p태그에 합계를 출력하시오 -->

    <input type="text" id="num">
    <button onclick="sum()">계산</button>
    <p id="print_1"></p>

    <script>
        let num = document.getElementById('num');
        let print_1 = document.getElementById('print_1');
        function sum(){
            let Num = Number(num.value)
            let sum = 0;
            for(let i = 1; i <= Num; i++){
                sum += i;
            }
            print_1.innerText = sum;
        }
    </script>

</body>
</html>
