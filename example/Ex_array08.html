<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심화배열 연습문제</title>
</head>
<body>
    <h1>배열 + for문 + if문 문제</h1>
    <label for = score>1번 점수 배열 입력 (예:95,67,80,55,100,72): <input type="text" id="score"></label><button onclick="scores()">결과 확인</button>

        <p id="p1"></p>

    
    <script>
        
        let p1 = document.getElementById('p1');
        function scores(){
            let score = document.getElementById('score').value;
            let totals = score.split(',');
            let result = "";
            for(i = 0; i < totals.length; i ++){
                if(totals[i] > 0){
                if(totals[i] >= 90){
                    result += ` ${totals[i]}점 : A, `
                }else if(totals[i] >= 80){
                    result += `${totals[i]}점 : B, `
                }else if(totals[i] >= 70){
                    result += `${totals[i]}점 : C, `
                }else{
                    result += `${totals[i]}점 : F, `
                }
                }else {
                    alert('ㄴㄴ')
                }
            }
            result = result.slice(0,-2);
            p1.innerText = result;
        };

    </script>
</body>
</html>
