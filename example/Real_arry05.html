<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습문제5</title>
    <style>
        div div{
            display: flex;
            height: 20px;
        }
    </style>
</head>
<body>
    <script>
        let output = document.getElementById('output');
        let products = ['노트북','마우스','키보드'];  //상품
        let stokes = [3,3,2]; // 재고수량
        let total = 0;
        function render(){
            for(let i = 0 ; i < products.length; i++){
                total += stokes[i];
            };
            for(let i = 0 ; i <products.length; i++){
                output.innerHTML =  `${products[i]} : ${stokes[i]} <button onclick = "render">-</button><button onclick = "render">+</button>`
            }
        }
    </script>
        <h1>실시간 재고 관리</h1>
        <div id="output">
        </div>

</body>
</html>
