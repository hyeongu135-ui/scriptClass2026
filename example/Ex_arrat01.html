<!DOCTYPE html>
<html lang="KO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 연습 기초문제</title>
</head>
<body>
    <p id="p1"></p>
    <p id="p2"></p>
    <p id="p3"></p>
    <p id="p4"></p>
    <p id="p5"></p>

    <script>
        // 문제1)p1태그에 1번 인덱스 값 출력
        let p1t = document.getElementById('p1');
        let number = [10,20,30,40,50,60];
        p1t.innerText = `문제 1번 : ${number[0]}`;
        // 문제2)p2태그에 slice를 이용하여 green과 blue의 값만 출력
        let p2t = document.getElementById('p2');
        let colors =['red','green','blue','yellow'];
        let value2 = colors.slice(1,3);
        p2t.innerText = `문제 2번 : ${value2}`;
        // 문제3)p3태그에 for문을 이용하여 전체요소 출력
        let p3 = document.getElementById('p3');
        let names = ['Jason','Alice','Candy'];
        let value3 = "";
        for(let i = 0; i < names.length ; i ++){
            value3 +=names[i]+" "
        };
        p3.innerText = `문제 3번 : ${value3}`;
        // 문제4)p4태그에 1~10까지 배열생성후, 짝수만 출력 
        let p4 = document.getElementById('p4');
        let result01 = "";
        let nums =[];
        for(let i = 1; i <= 10; i++){
            nums.push(i);
            if(nums[i-1] % 2 == 0){
                result01 += nums[i-1] + " " ;
            }
        }
        p4.innerText = `문제 4 : ${result01}`;
        
        
        // 문제5)p5태그에 score가 80이상이면 '힙격',아니면 '불합격' 출력.
        let p5 = document.getElementById('p5');
        let scores = [90,75,60,100,88];
        let result02 = '';
        for(let i = 0; i < scores.length; i++){
            if(scores[i] >= 80) {
                result02 += '합격'+" ";
            }else{
                result02 += '불합격'+" ";
            }
        }
        p5.innerText = `5번 ${result02}`;


    </script>
</body>
</html>
