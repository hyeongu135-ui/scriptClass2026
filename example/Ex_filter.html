<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter 메소드</title>
    <style>
        .container{
            width: 400px;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn">과일</button>
        <button class="btn">어류</button>
        <ul class="cart"></ul>
    </div>
    <script>
        let btn = document.querySelectorAll('.container .btn');
        let cart = document.querySelector('.cart')


        let menu = [
            {id:0, name:'딸기', category:1},
            {id:1, name:'포도', category:1},
            {id:2, name:'바나나', category:1},
            {id:3, name:'고등어', category:2},
            {id:4, name:'조기', category:2},
            {id:5, name:'갈치', category:2}
        ]

        console.log(cart)
        console.log(btn)

        // ul li그림 그리는 render()함수 작성
        function render(cateNum){
            //filter()메소드 사용 : 조건이 만족할 때 새로운 배열로 반환
            //대입형 익명함수 사용
            //filter 메소드의 return 사용시 {}블록을 사용한다.
            let filterMenu = menu.filter((item) => {
                // 오브젝트 
                return item.category === cateNum;
            })
             let result = '';
            for(let i = 0; i < filterMenu.length; i++){
                result += `<li>${filterMenu[i].name}</li>`
            }    
            cart.innerHTML = result; 
        }

        render(1);

        for(let i = 0; i<btn.length; i++){
            btn[i].addEventListener('click',() =>{
                render(i+1);
            })
        }
    </script>
</body>
</html>
