    <script>
        let menus = [

                        { id: 1, name: '아메리카노', type: 'ICE', price: 1300,quantity:1 },
                        { id: 2, name: '바닐라라떼', type: 'HOT', price: 2500,quantity:1 },
                        { id: 3, name: '바닐라라떼', type: 'ICE', price: 2800,quantity:1 },

                        { id: 6, name: '카라멜마끼아또', type: 'HOT', price: 2800,quantity:1 },

                        { id: 8, name: '카페모카', type: 'HOT', price: 3000,quantity:1 },
                        { id: 9, name: '카페모카', type: 'ICE', price: 3300,quantity:1 },
                        { id: 10, name: '딥카페라테', type: 'HOT', price: 3400,quantity:1 },

                    ];     
       //DOM
        let menu_output = document.getElementById('menu_output');
        let total = document.getElementById('total');
        let total_price = document.getElementById('total_price');
        let menu_add = [];
        
        //메뉴 출력
        let result = '';
        for(let i = 0 ; i < menus.length; i++){
            result += `<li id='menu_li' onclick="add(${i})">
                <img src="/Kiosk/img/${i}.png" alt="">
                <span>${menus[i].type}</span><br>
                <em>${menus[i].name}</em>
                <p>${menus[i].price}</p>
                </li>`
            }
            menu_output.innerHTML = result;                
            
            function add(addindex){
                
                let check = -1;
                let output = '';
                
                for(let i = 0 ; i < menu_add.length; i ++){
                    if( menu_add[i].id == menus[addindex].id){
                        check = i;
                        break;
                    }
                }
                // 수량만 추가한다.
                // menu_add 배열의 상품이 존재하는지 유무를 check로 한다.
                if(check == -1){
                    // 장바구니 비어
                    // 상품 menu_add 배열에 추가
                    menu_add.push(menus[addindex]);

                    
                }else{
                    // check= -1이 아니면 상품 없어
                    // 수량 누적
                    menu_add[check].quantity++;

                }  
                for(let i = 0; i < menu_add.length; i ++){
                    output += `<li>${menu_add[i].name}${menu_add[i].type}${menu_add[i].quantity}. ${menu_add[i].price*menu_add[i].quantity}
                                <button onclick = 'plus(${i})'>+</button>
                                <button onclick = 'minus(${i})'>-</button>
                                <button onclick = 'del(${i})'>del</button>
                                </li>`;
                }
                total.innerHTML = output;
            }
            
            function render(){
                let output = '';
                let sum = 0;
                for(let i = 0; i < menu_add.length; i++){
                    sum += menu_add[i].price*menu_add[i].quantity
                    for(let i = 0; i < menu_add.length; i ++){
                        output += `<li>${menu_add[i].name}${menu_add[i].type}${menu_add[i].quantity}. ${menu_add[i].price*menu_add[i].quantity}
                                    <button onclick = 'plus(${i})'>+</button>
                                    <button onclick = 'minus(${i})'>-</button>
                                    <button onclick = 'del(${i})'>del</button>
                                    </li>`;
                    }


                    // total_price.innerHTML = `총 합계 : ${sum}`
                }
                }
                
            
            //총합
            let sum = 0;
            for(let i = 0 ; i < menu_add.length; i++){
                sum += menu_add[i].price*menu_add[i].quantity
                
            }

            function plus(j){
                menu_add[j].quantity++
                render()

            }
            
            function minus(j){
                    menu_add[j].quantity--;

                    render()
                    
                }
            function del(j){
      
            }

            render()
        
    </script>
