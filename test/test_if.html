<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    id<input type="text" id="id"><br>
    Pw<input type="password" id="pw">
    <button onclick="logincheck()">로그인</button>

    <script>   
        // 자바스크립트 데이터 타입 종류
        // 1. 원시타입(Primitive Type) : 순수데이터를 말함
        // => string, number, boolean, null, undifined...
        // 2. 객체 타입(object Type) : Object, Array, Function...
        // => 길이 출력 = length

        let num = 5;
        if(num % 2 == 0){
            console.log('짝수');
        }else{
            console.log('홀수');
        }
        
        
        function logincheck(){
            let idC = document.getElementById("id").value;
            let pwC = document.getElementById("pw").value;

            //원시타입인 string 데이터 타입에 length를 입력하면 
            //자바스크립트가 알아서 객체 타입으로 다루어 준다.
            // = 자바스크립트의 유연성
            console.log(idC)
            console.log(pwC)

        if(idC == 'admin' && pwC == '1234'){
            console.log('로그인 성공');
            alert('로그인 성공')
        }else{
            console.log('로그인 실패');
            alert('로그인 실패')
        }
    }
        // 로그인 문제
        // 1. ID와 PW 입력하는 input 2개 작성
        // 2. button 버튼에 onclick=logincheck() 함수 작성
        // 3. ID= 'admin' , PW = '1234'이면 로그인 성공, 아니면 로그인 실패
        // 4. console.log에 출력할 것
    </script>
</body>
</html>
