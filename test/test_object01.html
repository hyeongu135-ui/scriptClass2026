<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>
        // 객체(object) 가장많이 서용하는 리터럴 방식으로 작성
        // 객체 이름 = { key: valuem, key:value...};
        // 객체 이름 + { property(속성): 데이터 1, property:데이터2}
        let book={
            title:'javaScript',
            author:'홍길동',
            page:500,
            price:15000,

        }
        //객체 접근 방법 : 객체이름.property
        // `` (백틱) 또는 +(문자나열)로 콘솔 시 
        // 자바스크립트가 기본적으로 toString()방식으로 출력함
        console.log(`book. 객체 : ${book}`)
        console.log(`book. 객체 : ${book.title}`)
        console.log(`book. 객체 : ${book.author}`)
        console.log(`book. 객체 : ${book.page}`)
        console.log(`book. 객체 : ${book.price}`)
        console.log('book. 객체 :', book)
        console.log('book. 객체 :'+ book)

        function Book01(title, author, page, price){
            this.title = title;
            this.author = author;
            this.page = page;
            this.price = price;
        }
        let myBook = new Book01('HTML','개나리',40,15000);
        console.log('myBook :',myBook)

        //객체의 property로 함수 가능하다.
        let Book02 ={
            title :'CSS',
            author:'진달래',
            page:30,
            price:2500,
            info:function(){
                alert(`${this.title}책의 분량은 ${this.page}쪽이다.`)
            }
        }
        Book02.info();
    </script>
</body>
</html>
