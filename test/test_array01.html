<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열(Array) 기초 설명</title>
</head>
<body>
    <script>
        //1. 기본 배열 선언과 초기화 하기
        let fruits = ['사과','딸기','포도'];
        console.log(`fruit 출력 : ${fruits}`);

        // 2. numbers 배열에 1부터 5까지 숫자 넣고, 2번 값 출력하기
        let numbers=[1,2,3,4,5];
        console.log(`number의 2번 값 : ${numbers[2]}`);
        // 배열의 데이터 타입은 object(객체)이다.
        console.log(`데이터 타입 number : ${typeof numbers}`);
        console.log(`데이터 타입 fruits : ${typeof fruits}`);

        // 3. 배열의 길이를 세는 property length
        // property는 ()가 존재하지 않음
        // method는 ()가 반드시 존재
        let name = [`Jason`,`Alice`,`Candy`,`Chris`];
        console.log(`name의 길이 : ${name.length}`);

        //4. 위의 numbers 배열을 이용하여 합계를 구하고 싶다 : for문 이용
        let sum = 0;
        for(i =0; i<numbers.length; i++){
            sum += numbers[i];
        }
        console.log(`numbers 합 : ${sum}`);

        //5. 혼합 배열 array01 선언
        let array01 = [10, `Switch`,`2026-09-28`]
        console.log(`array01의 요소 출력 : ${array01}`);

        //6. 배열 선언 두 번째 방식
        let array03 = Array(50,60,70);
        console.log(`arry03 요소 출력 : ${array03}`);
        
        // 7. 배열 선언 세번째 방식
        //  array04의 참조변수는 값이 없음
        //  아래와 같은 경우 값을 출력하지 않음
        let array04 = new Array(3);
        console.log(`arry04 요소 출력 : ${array04}`);
        
        // 8. 빈 배열 출력 : fill()메소드를 이용하여 값을 지정하는 방식
        let array05 = new Array(3).fill(0);
        console.log(`arry05 요소 출력 : ${array05}`);
        
        // 위으 array05배열의 각 요소 값을 1,2,3,으로 변경하여 출력 하기
        for(i = 0 ; i < array05.length; i ++){
            array05[i] = i+1;
        }
        console.log(`arry05 요소 출력 : ${array05}`);


    </script>
</body>
</html>
