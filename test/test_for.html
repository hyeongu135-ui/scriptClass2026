<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문 : for</title>
</head>
<body>
    <p id="result"></p>

    <script>
        let num = 0;
        while(num<5){
            console.log(`num : ${num}`);
            num++;
            console.log(`num 누적 결과 : ${num}`);
        }

        // DO ~ while : 
        // DO { 실행문 } while(조건식); => 무조건 한 번은 실행됨
        // 조건을 만족하지 않아도 무조건 한번 실행
        let count = 0;
        do{
            console.log(`무조건 한번은 출력`);
            count++
            console.log(`count 누적 결과 ${count}`);

        }while(count<3);
            console.log(`count 끝 ${count}`)

            // for문 : 조건이 만족할때까지 순회
            for(let i=0; i<10; i++){
                console.log(`반복 i : ${i}`);
            }
            // const 키워드는 재할당 자체가 안됨
            // 반복문에서는 사용 불가
            // for(const i=0; i<10; i++){
            //     console.log(`반복 i : ${i}`);
            // }

            // 1~10까지 출력
            // p채크
            let result = document.getElementById('result');
            // for문 이용
            let text = '';
            for(let i=1; i<=10; i++){
                text += "<strong>" + i + "<strong>";
            }
            // result.innerText =text; //태그 안에 텍스트 형식으로 넣어주는 것
            result.innerHTML =text; //태그 안에 텍스트 형식으로 넣어주는 것
    </script>
</body>
</html>
