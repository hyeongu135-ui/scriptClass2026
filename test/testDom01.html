<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>queryselector</title>
    <style>
        ul li{
            cursor: pointer;
            list-style: none;
        }
        ul li:hover{
            width: 100px;
            background-color: black;
            color: aliceblue;
        }
    </style>

</head>
<body>
    <div class="orderlist">1. 아메리카노 - 4,000원</div>

    <ul>
        <li onclick="pay()">aaaa</li>
        <li onclick="pay01()">bbbb</li>
    </ul>

    <script>
        // DOM객체 : HTML 문서에 접근하는 방법
        // document.querySelector('')
        // document.querySelectorAll('')
        // ===> 조건에 만족하는 첫번째 단 하나의 요소에만 접근한다.
        // ===> id,class 모두 접근 가능.
        let order = document.querySelector('.orderlist');
        let order2 = document.querySelector('#orderlist');

        console.log(order);
        order.style.color = 'blue';


        // document.querySelectorAll('')
        // ==> 조건 만족 모든 요소에 접근 가능.
        // ==> 장바구니를 통쨰로 접근함.
        // 배열과 유사한 개념
        let orderlist = document.querySelectorAll('.orderlist');
        console.log(orderlist)
        
        function pay(){
            orderlist[0].style.color='red';
            
        }
        function pay01(){}

    </script>
</body>
</html>
